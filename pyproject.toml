[project]
name = "meze"
version = "0.0.1"
authors = [
  { name="Jasmin Güven", email="jasmin.guven@bristol.ac.uk" },
]
description = "Metalloenzyme parameterisation tool"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/meyresearch/meze"
Issues = "https://github.com/meyresearch/meze/issues"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires real MD/BSS runs",
    "gpu: requires a GPU / AMBERHOME",
]
