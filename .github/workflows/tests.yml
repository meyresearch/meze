name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint (fail on real errors)
        run: flake8 meze/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (style/complexity report only)
        run: flake8 meze/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: dev-environment.yml
          environment-name: meze-dev
          cache-environment: true
          cache-downloads: true

      - name: Run tests
        shell: bash -el {0}
        run: |
          pytest tests/ -m "not slow and not gpu" --cov=meze --cov-report=term-missing
